<!DOCTYPE html>
<html lang="es" data-hasmsg="{{ '1' if (error or exito) else '0' }}">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>El Costa</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"/>

  <!-- Decide ANTES de pintar si toca reproducir la intro (evita parpadeos).
       Solo 1 vez por sesión, nunca con reduce-motion ni si hay error/éxito. -->
  <script>
    (function () {
      try {
        var hasMsg = document.documentElement.getAttribute('data-hasmsg') === '1';
        var played = sessionStorage.getItem('introPlayed');
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!played && !reduce && !hasMsg) document.documentElement.classList.add('intro');
      } catch (e) {}
    })();
  </script>

  <!-- GSAP 3.13. defer preserva el orden con login.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</head>
<body>

  <!-- ───── BOTÓN SALTAR INTRO ───── -->
  <button id="skipIntro" class="skip-btn" type="button">Saltar intro →</button>

  <!-- ───── LOGIN (engranaje + formulario) — entrada elegante ───── -->
  <div id="reveal">

    <div class="glow"></div>

    <!-- Engranaje dorado (la envoltura se anima; el SVG gira con CSS) -->
    <div class="gear-wrap">
      <svg class="gear-spin" style="width:100%;height:100%;"
           viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3D2600"/><stop offset="15%" stop-color="#A06808"/><stop offset="35%" stop-color="#F0C040"/>
            <stop offset="52%" stop-color="#E8A818"/><stop offset="68%" stop-color="#B07010"/><stop offset="85%" stop-color="#C88010"/><stop offset="100%" stop-color="#5A3800"/>
          </linearGradient>
          <filter id="gs"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#C8900A" flood-opacity="0.4"/></filter>
        </defs>
        <path id="gearPath" fill="url(#gold)" fill-rule="evenodd" stroke="#6B4400" stroke-width="0.6" filter="url(#gs)"/>
      </svg>
    </div>

    <!-- Pasada de luz dorada -->
    <div class="sweep"></div>

    <!-- <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;display:inline-block"><polyline points="20 6 9 17 4 12"/></svg> FORM conectado con Flask (contrato intacto) -->
    <form method="POST" action="{{ url_for('login') }}"
          style="position:relative;z-index:10;width:200px;display:flex;flex-direction:column;align-items:center;gap:14px;">

      <h1 class="stagger" style="color:#fff;font-size:22px;font-weight:700;letter-spacing:0.12em;text-shadow:0 0 18px rgba(240,192,64,0.5);font-family:'Orbitron', sans-serif;">
        El Costa
      </h1>

      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
      {% if exito %}
        <div class="ok-msg">{{ exito }}</div>
      {% endif %}

      <div class="stagger" style="width:100%;display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <input type="text" name="correo" placeholder="Correo" value="{{ correo or '' }}" required/>
        </div>
        <div class="field">
          <input type="password" name="contrasena" placeholder="Contraseña" required/>
        </div>
      </div>

      <button type="submit" class="login-btn stagger">Ingresar</button>

      <div class="stagger" style="display:flex;justify-content:center;width:100%;padding:0 2px;">
        <a href="{{ url_for('recuperar') }}" class="link">¿olvidaste tu contraseña?</a>
      </div>

    </form>
  </div>

</body>
</html>
