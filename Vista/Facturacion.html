<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facturación — Taller El Costa</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>

:root{
  --orange:#f97316;
  --dark:#0f0f0f;
  --dark2:#1a1a1a;
  --dark3:#242424;
}

*{
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--dark);
  color:#e5e7eb;
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
}

h1,h2,h3{
  font-family:'Oswald',sans-serif;
}

::-webkit-scrollbar{
  width:5px;
}

::-webkit-scrollbar-track{
  background:var(--dark);
}

::-webkit-scrollbar-thumb{
  background:var(--orange);
  border-radius:999px;
}

.main-card{
  background:var(--dark2);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:28px;
  box-shadow:0 0 40px rgba(0,0,0,0.35);
  animation:fadeUp .6s ease;
  position:relative;
  z-index:1;
}

.mini-card{
  background:var(--dark3);
  border:1px solid rgba(255,255,255,0.05);
  border-radius:20px;
}

.title-gradient{
  background:linear-gradient(135deg,#f97316 0%,#fb923c 40%,#fbbf24 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

input,
select{
  background:#111111 !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  color:white !important;
  transition:0.25s;
}

input::placeholder{
  color:#6b7280;
}

input:focus,
select:focus{
  border-color:#f97316 !important;
  box-shadow:0 0 0 3px rgba(249,115,22,0.15);
  outline:none;
}

label{
  color:#9ca3af;
  font-size:0.9rem;
  margin-bottom:0.4rem;
  display:block;
}

.btn{
  padding:0.9rem 1.6rem;
  border-radius:14px;
  font-weight:600;
  transition:0.25s;
  border:none;
  cursor:pointer;
  color:white;
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-orange{
  background:linear-gradient(135deg,#f97316,#ea580c);
  box-shadow:0 4px 20px rgba(249,115,22,0.35);
}

.btn-dark{
  background:#374151;
}

.btn-dark:hover{
  background:#4b5563;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:0.3rem;
  padding:0.3rem 0.7rem;
  border-radius:999px;
  font-size:0.75rem;
  font-weight:700;
  background:rgba(249,115,22,0.1);
  color:#f97316;
  border:1px solid rgba(249,115,22,0.2);
}

.gear{
  position:fixed;
  opacity:0.04;
  z-index:0;
  animation:spin 18s linear infinite;
  pointer-events:none;
}

.gear2{
  animation-direction:reverse;
  animation-duration:12s;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body class="p-6">

<!-- ENGRANAJES -->
<svg class="gear" style="width:220px;top:-40px;left:-50px;" viewBox="0 0 100 100" fill="#f97316">
<path d="M50 15 L58 18 L64 12 L72 20 L68 28 L75 34 L84 32 L88 42 L80 48 L82 58 L72 62 L66 56 L58 60 L56 70 L44 70 L42 60 L34 56 L28 62 L18 58 L20 48 L12 42 L16 32 L25 34 L32 28 L28 20 L36 12 L42 18 Z"></path>
</svg>

<svg class="gear gear2" style="width:150px;bottom:-30px;right:-30px;" viewBox="0 0 100 100" fill="#f97316">
<path d="M50 15 L58 18 L64 12 L72 20 L68 28 L75 34 L84 32 L88 42 L80 48 L82 58 L72 62 L66 56 L58 60 L56 70 L44 70 L42 60 L34 56 L28 62 L18 58 L20 48 L12 42 L16 32 L25 34 L32 28 L28 20 L36 12 L42 18 Z"></path>
</svg>

<div class="max-w-6xl mx-auto main-card p-8">

<!-- HEADER -->
<div class="flex flex-col md:flex-row md:justify-between md:items-center gap-6 mb-10 border-b border-white/5 pb-6">

<div>
<h1 class="text-5xl font-black uppercase tracking-[0.2em] title-gradient leading-none">
Facturación
</h1>

<p class="text-gray-500 mt-3 tracking-[0.2em] uppercase text-sm">
Taller El Costa
</p>
</div>

<div class="text-left md:text-right">

<p class="text-gray-500 text-xs uppercase tracking-widest mb-1">
Sistema de Facturas
</p>

<span class="badge">
Facturación Activa
</span>

</div>

</div>

<!-- FORMULARIO -->
<div class="mini-card p-8">

<div class="flex items-center gap-3 mb-8">

<div class="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl"
style="background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.2);">
🧾
</div>

<div>
<h2 class="text-2xl font-bold text-orange-400">
Registro de Factura
</h2>

<p class="text-gray-500 text-sm mt-1">
Completa la información de facturación
</p>
</div>

</div>

<form class="grid md:grid-cols-2 gap-6">

<!-- ID ORDEN -->
<div>
<label>ID Orden</label>

<input
type="number"
name="Fac_id_orden"
placeholder="Ingrese el ID de la orden"
class="w-full p-4 rounded-xl"
/>
</div>

<!-- ID USUARIO -->
<div>
<label>ID Usuario</label>

<input
type="number"
name="Fac_id_usu"
placeholder="Ingrese el ID del usuario"
class="w-full p-4 rounded-xl"
/>
</div>

<!-- NUMERO FACTURA -->
<div>
<label>Número de Factura</label>

<input
type="number"
name="Fac_num_fact"
placeholder="Ingrese número de factura"
class="w-full p-4 rounded-xl"
/>
</div>

<!-- METODO PAGO -->
<div>
<label>Método de Pago</label>

<select
name="Fac_Met_pago"
class="w-full p-4 rounded-xl">

<option>Nequi</option>
<option>Daviplata</option>
<option>Tarjeta</option>
<option>Efectivo</option>

</select>
</div>

<!-- FECHA -->
<div>
<label>Fecha</label>

<input
type="date"
name="Fac_Fecha"
class="w-full p-4 rounded-xl"
/>
</div>

<!-- TOTAL -->
<div>
<label>Total ($)</label>

<input
type="number"
name="Fac_total"
placeholder="Ingrese el total"
class="w-full p-4 rounded-xl"
/>
</div>

<!-- RESUMEN -->
<div class="md:col-span-2">

<div class="mini-card p-6 mt-2"
style="border-color:rgba(249,115,22,0.15);">

<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">

<div>
<h3 class="text-xl font-bold text-orange-400 mb-2">
💰 Resumen de Facturación
</h3>

<p class="text-gray-500 text-sm">
Sistema de control de pagos del taller
</p>
</div>

<div>
<h2 class="text-5xl font-black text-orange-400 leading-none"
style="font-family:'Oswald',sans-serif;">
$
</h2>
</div>

</div>

</div>

</div>

<!-- BOTONES -->
<div class="md:col-span-2 flex flex-wrap justify-center gap-4 pt-6">

<button
type="reset"
class="btn btn-dark">
🧹 Limpiar
</button>

<button
type="submit"
class="btn btn-orange">
💾 Guardar Factura
</button>

</div>

</form>

</div>

</div>

</body>
</html>
